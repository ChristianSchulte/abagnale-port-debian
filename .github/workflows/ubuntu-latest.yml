name: Ubuntu (latest)

on:
  push:
    branches: [ "trixie" ]
  pull_request:
    branches: [ "trixie" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        build_type: [Release]
        c_compiler: [gcc, clang]
        include:
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
    steps:
    - uses: actions/checkout@v4

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Install build dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run : |
        sudo apt-get update
        sudo apt-get install devscripts equivs
        sudo mk-build-deps -i -r

    - name: Build
      run: debian/build

    - name: Upload build artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: abagnale-port-debian-${{ matrix.os }}-${{ matrix.c_compiler }}-${{ matrix.build_type }}
        path: |
          ${{ github.workspace }}/*.deb
          ${{ github.workspace }}/*.ddeb
          ${{ github.workspace }}/*.orig.tar.gz
          ${{ github.workspace }}/*.debian.tar.xz
          ${{ github.workspace }}/*.dsc
          ${{ github.workspace }}/*.buildinfo
          ${{ github.workspace }}/*.changes
