name: Ubuntu

on:
  push:
    branches: [ "trixie" ]
  pull_request:
    branches: [ "trixie" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-slim, ubuntu-latest, ubuntu-22.04, ubuntu-24.04, ubuntu-26.04, ubuntu-22-04-arm, ubuntu-24.04-arm, ubuntu-26.04-arm]
        build_type: [Release]
        c_compiler: [gcc, clang]
        include:
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
    steps:
    - uses: actions/checkout@v4

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Install build dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run : |
        sudo apt-get update
        sudo apt-get install devscripts equivs
        sudo mk-build-deps -i -r

    - name: Build
      run: debian/build

    - name: Stage Artifacts
      run: |
        mkdir -p ${{ github.workspace }}/artifacts
        ls -lah ../
        find .. -maxdepth 1 -type f \( -name "*.deb" -o -name "*.ddeb" -o -name "*.gz" -o -name "*.xz" -o -name "*.dsc" -o -name "*.buildinfo" -o -name "*.changes" \) -exec cp {} ${{ github.workspace }}/artifacts/ \;

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: abagnale-port-debian-${{ matrix.os }}
        path: ${{ github.workspace }}/artifacts/
        if-no-files-found: error

